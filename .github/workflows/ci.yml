name: CI

on:
  pull_request:
  push:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check frontend/assets/js/app.js

  windows-portable-smoke:
    runs-on: windows-latest
    needs: python-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise portable runtime twice
        shell: powershell
        run: tests/windows/portable-smoke.ps1
      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-diagnostics
          path: test-artifacts/windows-portable/
