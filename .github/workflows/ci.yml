name: CI

on:
  pull_request:
  push:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify offline runtime assets and repair contract
        run: python -m pytest tests/test_offline_assets.py -q
      - run: python -m pytest -q
      - run: node --check frontend/assets/js/core.js
      - run: node --check frontend/assets/js/components.js
      - run: node --check frontend/assets/js/flow_timeline.js
      - run: node --check frontend/assets/js/flow.js
      - run: node --check frontend/assets/js/economics_workspace.js
      - run: node --check frontend/assets/js/economics_daily.js
      - run: node --check frontend/assets/js/app.js
      - run: node --check frontend/assets/js/plan_workspace.js

  plan-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise production Plan with synthetic local API
        run: python tests/browser/plan_workspace_smoke.py
      - run: python -m pip install -r requirements-dev.txt
      - name: Exercise Economics advertising with real loopback API
        run: python -m tests.browser.economics_advertising_smoke
      - name: Exercise Economics periods and stable article editing
        run: python -m tests.browser.economics_periods_smoke
      - name: Exercise Economics exports, profit, focused clusters and clipboard
        run: python -m tests.browser.economics_focus_smoke
      - name: Upload Plan browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-browser-screenshots
          path: test-artifacts/plan-ui/
      - name: Upload Economics browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-browser-screenshots
          path: test-artifacts/economics-ui/
      - name: Upload Economics period screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-period-screenshots
          path: test-artifacts/economics-periods/
      - name: Upload Economics focus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economics-focus-screenshots
          path: test-artifacts/economics-focus/

  windows-portable-smoke:
    runs-on: windows-latest
    needs: python-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise offline portable release
        shell: powershell
        run: tests/windows/portable-smoke.ps1
      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-diagnostics
          path: test-artifacts/windows-portable/
