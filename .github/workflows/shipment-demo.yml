name: Shipment screen prototype
on:
  push:
    branches: [codex/demo-shipment-readiness]
    paths:
      - deliverables/sklad-ozon-shipments-demo.html
      - deliverables/SHIPMENT-DEMO.md
      - prototype_checks/shipment_demo_browser.py
      - .github/workflows/shipment-demo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance
        run: python prototype_checks/shipment_demo_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sklad-ozon-shipments-demo
          path: |
            deliverables/sklad-ozon-shipments-demo.html
            deliverables/SHIPMENT-DEMO.md
            test-artifacts/shipment-demo/
          retention-days: 14
