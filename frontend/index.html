<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Склад Ozon</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main><h1>Склад Ozon</h1><form id="analysis-form"><section><h2>Данные Ozon</h2><div class="grid"><label>Доступность товаров<input type="file" name="availability_file" required><span class="status"></span></label><label>Ограничения складов<input type="file" name="restrictions_file" required><span class="status"></span></label><label>История заказов<input type="file" name="orders_file" required><span class="status"></span></label></div></section><section><h2>Экономика</h2><div class="grid"><label>Юнитка Ozon<input type="file" name="unitka_file" accept=".xlsx" required><span class="status"></span></label></div></section><section><h2>Настройки расчёта</h2><div class="settings"><label>Дата расчёта<input type="date" name="as_of" required></label><label>Эквайринг<input name="acquiring_rate" value="0.01"></label><label>Реклама<input name="advertising_rate" value="0"></label><label>Выкуп<input name="buyout_rate" value="1"></label><label>Фиксированный FBO сбор<input name="fixed_fbo_fee" value="0"></label><label>Налоговая система<select name="tax_system"><option value="usn_income">УСН доходы</option><option value="usn_income_minus_expenses">УСН доходы−расходы</option><option value="osno">ОСНО</option><option value="manual">Ручная</option></select></label><label>Налог на доход<input name="income_tax_rate" value="0.06"></label><label>НДС<input name="vat_rate" value="0"></label><label>Соинвест<input name="co_invest_rate" value="0"></label><label>Мин. прибыль<input name="min_profit_per_unit" value="0"></label><label>Мин. маржа<input name="min_margin_rate" value="0"></label><label>Мин. ROI<input name="min_roi" value="0"></label></div></section><button type="submit">Рассчитать</button><p id="loading" hidden>Выполняется расчёт…</p><p id="server-error" role="alert"></p></form><section id="results" hidden><h2>Результаты</h2><div id="summary" class="summary"></div><table><thead><tr><th>SKU</th><th>Кластер</th><th>Ozon рекомендация</th><th>Физически допустимо</th><th>Покрытие логистики</th><th>Прибыль / ед.</th><th>Маржинальность</th><th>ROI</th><th>Распределить, шт.</th><th>Статусы</th></tr></thead><tbody></tbody></table><h3>Stockout / distortion evidence</h3><pre id="signals"></pre><h3>Диагностика и ошибки</h3><ul id="diagnostics"></ul></section></main><script src="/assets/js/app.js"></script><script>SkladOzon.boot();</script></body></html>
